name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (warnings are errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # docs/requirements.txt installs mageck2 from source, which compiles its
      # C++ helpers; ubuntu-latest already has g++ and make.
      - name: Install documentation requirements
        run: python -m pip install --upgrade pip && pip install -r docs/requirements.txt

      # -W matches what Read the Docs does (sphinx.fail_on_warning). An
      # unresolved cross-reference or a heading anchor that stopped existing is
      # the drift this repository is here to catch, so it fails the build rather
      # than shipping a broken link.
      - name: Build HTML
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: html
          path: docs/_build/html
          retention-days: 14

  linkcheck:
    name: Link check
    runs-on: ubuntu-latest
    # External links rot for reasons that have nothing to do with the change
    # under review, so this reports without blocking. Internal links are already
    # covered by -W in the build job above.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install documentation requirements
        run: python -m pip install --upgrade pip && pip install -r docs/requirements.txt

      - name: Check links
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck
